<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工作室｜Workstudio</title>
<link rel="stylesheet" href="/workstudio/studio.css">
<link rel="stylesheet" href="/workstudio/studio-workshop.css">
<link rel="stylesheet" href="/workstudio/studio-immersive.css">
</head>
<body>
<div class="studio-shell">
<main class="studio-layout" aria-label="AI 2D 工作室">
  <section class="world-panel" aria-label="2D 工作室主場景">
    <header class="studio-topbar">
      <div class="studio-brand"><span class="studio-mark" aria-hidden="true">✦</span><div><div class="studio-eyebrow">OPENCLAW · AI WORKSTUDIO</div><h1>AI 工作室</h1></div></div>
      <div class="studio-controls">
        <span class="connection" id="connection">連線中</span>
        <button class="studio-action" id="openTeams" type="button" aria-controls="studioDrawer">團隊</button>
        <button class="studio-action" id="openSessions" type="button" aria-controls="studioDrawer">紀錄</button>
      </div>
    </header>
    <nav class="team-filter" id="teamFilters" aria-label="工作室團隊篩選"></nav>
    <div class="world-scroll" tabindex="0" aria-label="可捲動的 2D 工作室，點選人物查看資訊">
      <div class="world-stage" id="worldStage">
        <img class="office-art" src="/workstudio/office-scene.svg" alt="2D 工作室環境，包含辦公桌、會議區、設備與室內裝飾">
        <div class="zone-label zone-design">設計行銷團隊</div>
        <div class="zone-label zone-finance">娃娃機財務團隊</div>
        <div id="agentPins" class="agent-pins" aria-label="工作室 Agent 人物"></div>
      </div>
    </div>
    <div class="studio-hint"><span id="worldSummary">正在取得 Agent 清單…</span><span>點擊人物查看資訊 · 無動畫</span></div>
  </section>
</main>
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="studio-drawer" id="studioDrawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <header class="drawer-header"><div><span class="panel-eyebrow" id="drawerEyebrow">AGENT</span><h2 id="drawerTitle">角色資訊</h2></div><button id="closeDrawer" class="drawer-close" type="button" aria-label="關閉資訊視窗">✕</button></header>
  <section id="drawerAgent" class="drawer-view"><div id="agentDetail" class="detail-content"><p class="muted">選擇人物後查看資訊。</p></div></section>
  <section id="drawerTeams" class="drawer-view" hidden><div id="teamSummary" class="team-summary"><p class="muted">正在讀取團隊資料…</p></div></section>
  <section id="drawerSessions" class="drawer-view" hidden><div id="recentSessions" class="recent-sessions"><p class="muted">目前尚無資料。</p></div></section>
</aside>
</div>
<script src="/workstudio/studio.js" defer></script>
</body>
</html>
