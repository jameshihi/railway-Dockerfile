<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 工作台</title>
  <link rel="stylesheet" href="/workstudio/style.css" />
  <link rel="stylesheet" href="/workstudio/hierarchy.css" />
  <link rel="stylesheet" href="/workstudio/agent-hud.css" />
  <link rel="stylesheet" href="/workstudio/avatar.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow">AI 團隊作業系統</p>
        <div class="title-row">
          <h1>AI 工作台</h1>
          <span class="version-chip">V1</span>
          <a class="version-chip" href="/workstudio/studio.html" style="text-decoration:none">工作室場景 ↗</a>
        </div>
        <p class="subtitle">Production 即時監控與團隊運作總覽</p>
      </div>
      <div class="status-cluster">
        <span class="status-label">系統狀態</span>
        <div class="status-pill" id="systemStatus">載入中</div>
      </div>
    </header>

    <section class="grid">
      <article class="card hero-card">
        <div class="card-header">
          <div>
            <p class="section-kicker">系統概況</p>
            <h2>中央控制</h2>
          </div>
          <span class="badge">按需連線</span>
        </div>
        <p id="snapshotSummary">正在讀取 OpenClaw 工作階段快照。此頁不使用輪詢，也不呼叫 AI 模型。</p>
      </article>

      <article class="card card-primary">
        <div class="card-header team-overview-heading">
          <div>
            <p class="section-kicker">團隊概況</p>
            <p class="team-overview-summary" id="teamOverviewSummary">正在彙整團隊與 Agent 資料…</p>
          </div>
          <span class="badge muted">Registry 驅動</span>
        </div>
        <div class="agent-list" id="agentList">
          <p class="empty">載入中…</p>
        </div>
      </article>

      <article class="card card-secondary">
        <div class="card-header">
          <div>
            <p class="section-kicker">活動紀錄</p>
            <h2>最近工作階段</h2>
          </div>
          <span class="badge muted">即時快照</span>
        </div>
        <div class="agent-list" id="sessionList">
          <p class="empty">載入中…</p>
        </div>
      </article>
    </section>
  </main>
  <script src="/workstudio/app.js" defer></script>
</body>
</html>
